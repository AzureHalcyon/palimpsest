name: 自测

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 装依赖
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: 全部离线自测
        run: python check_all.py
