<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>palimpsest</title>
<style>
:root{
  /* 取自 deepseek-harness/packages/client/ui-theme/src/styles/design-platform.css
     深色主题（body[data-ds-dark-theme]）：neutral-bluish 阶梯 + 白字。 */
  --bg:#151517;                        /* alias-bg-base   = bluish-950 */
  --panel:#1b1b1c;                     /* specific-sidebar-fill = bluish-900 */
  --field:#2c2c2e;                     /* specific-bubble / input-major = bluish-850 */
  --raise:#232324;                     /* alias-bg-layer-1 = bluish-875 */
  --hover:rgba(255,255,255,.08);       /* alias-interactive-bg-hover */
  --line:rgba(255,255,255,.06);        /* alias-border-l1 */
  --line2:rgba(255,255,255,.12);       /* alias-border-l2 */
  --line3:rgba(255,255,255,.16);       /* alias-border-l3 */
  --fg:#f9fafb;                        /* alias-label-primary  = bluish-50 */
  --fg2:#cfd3d6;                       /* alias-label-secondary = bluish-300 */
  --dim:#adb2b8;                       /* alias-label-tertiary = bluish-400 */
  --faint:#81858c;                     /* alias-label-caption  = bluish-600 */
  --ghost:#5f6469;
  --you:#7aaaff;                       /* alias-link = deepseek-400 */
  --tool:#b7c8fe;                      /* deepseek-300 */
  --warn:#f59e0b;                      /* state-warn-primary */
  --ok:#22c55e;                        /* state-success-primary */
  --bad:#f25a5a;                       /* state-error-primary */
  --mono:'SF Mono','JetBrains Mono','Fira Code',Consolas,'Liberation Mono',Menlo,
    Courier,'PingFang SC','Microsoft YaHei';
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB',
    'Microsoft YaHei','Helvetica Neue',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
  font:14.5px/1.72 var(--sans);-webkit-font-smoothing:antialiased}
body{display:flex;min-height:100vh}

/* ── 左栏 ─────────────────────────────────────────────────────────────── */
#side{width:236px;flex:0 0 236px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:0 12px 14px;overflow-y:auto}
#side .brand{display:flex;align-items:center;gap:8px;padding:18px 6px 16px;
  font-weight:600;font-size:14px;letter-spacing:.02em}
#side .brand i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--fg);
  display:inline-block}
#side .new{display:flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--line2);border-radius:10px;padding:9px;font-size:13px;
  color:var(--fg);background:transparent;cursor:pointer;width:100%}
#side .new:hover{background:var(--hover)}
#side nav{margin-top:14px;display:flex;flex-direction:column;gap:2px}
#side nav a{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;
  color:var(--dim);font-size:13px;cursor:default}
#side nav a:hover{background:var(--hover);color:var(--fg)}
#side .lab{margin:18px 8px 7px;font-size:11px;color:var(--ghost);letter-spacing:.04em}

.stat{display:flex;justify-content:space-between;padding:4px 8px;font-size:12px;
  color:var(--faint);font-family:var(--mono)}
.stat b{color:var(--fg2);font-weight:500}
.meter{height:4px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin:2px 8px 9px}
.meter i{display:block;height:100%;background:var(--faint)}
.meter.hot i{background:var(--warn)}

#side .band{display:block;width:100%;text-align:left;background:transparent;border:0;
  padding:6px 8px;border-radius:8px;color:var(--faint);font-size:12px;
  font-family:var(--mono);cursor:pointer}
#side .band:hover{background:var(--hover);color:var(--fg2)}

#side .foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);
  font-size:11px;color:var(--ghost);font-family:var(--mono)}

/* ── 主区 ─────────────────────────────────────────────────────────────── */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#top{display:flex;align-items:center;gap:10px;padding:12px 22px;
  border-bottom:1px solid var(--line);font-size:13px;color:var(--dim)}
#top .tabs{display:flex;gap:16px;font-size:13px}
#top .tabs span{padding-bottom:11px;margin-bottom:-12px;border-bottom:1.5px solid transparent;
  cursor:default}
#top .tabs span.on{color:var(--fg);border-bottom-color:var(--fg)}
#top .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.pill:empty{display:none}
.pill{border:1px solid var(--line2);border-radius:999px;padding:2px 10px;font-size:11.5px;
  color:var(--dim);font-family:var(--mono)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ghost);display:inline-block}
.dot.thinking{background:var(--you);animation:pulse 1.1s infinite}
.dot.waiting{background:var(--warn)}
.dot.retry{background:var(--bad);animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.2}}

#thread{flex:1;overflow-y:auto;padding:26px 0 32px}
.wrap{width:100%;max-width:760px;margin:0 auto;padding:0 24px}

.divider{display:flex;align-items:center;gap:10px;margin:24px 0 6px;color:var(--ghost);
  font-size:11px;font-family:var(--mono)}
.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.divider:first-child{margin-top:0}

.row{display:flex;margin:10px 0}
.row.user{justify-content:flex-end}
.row.user .body{background:var(--field);border-radius:14px;padding:8px 14px;
  max-width:78%;white-space:pre-wrap;word-break:break-word;color:var(--fg2)}
.row.assistant .body{white-space:pre-wrap;word-break:break-word;color:var(--fg)}

/* 一行式披露行：和 DSH 的 DisclosureRow 一样——16px 图标位、gap 6、13/24 标题、
   2px 小点分隔、摘要一行省略号；展开后正文缩进 22px。 */
details.frow{display:block;margin:1px 0}
details.frow>summary{display:flex;align-items:center;min-width:0;list-style:none;
  color:var(--dim);font-size:13px;line-height:24px;cursor:pointer}
details.frow>summary::-webkit-details-marker{display:none}
details.frow>summary:hover{color:var(--fg2)}
.frow .ico{flex:none;width:16px;height:16px;display:grid;place-items:center;
  margin-right:6px;font-size:11px;color:var(--faint)}
.frow .ttl{flex:none}
.frow .sdot{flex:none;width:2px;height:2px;border-radius:1px;background:var(--faint);
  margin:0 8px}
.frow .sum{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;color:var(--faint);font-size:13px}
.frow[open] .sum{color:var(--ghost)}
.fbody{padding:2px 0 6px 22px;font-family:var(--mono);font-size:12px;line-height:1.65;
  color:var(--dim);white-space:pre-wrap;word-break:break-word;max-height:320px;
  overflow:auto}

.note{margin:8px 0;padding:5px 12px;border-left:2px solid var(--warn);color:var(--dim);
  font-size:12px;font-family:var(--mono)}
.empty{color:var(--ghost);font-size:13px;text-align:center;padding:60px 0}

/* ── 输入 ─────────────────────────────────────────────────────────────── */
#bottom{padding:0 24px 10px}
.composer{max-width:760px;margin:0 auto;border:1px solid var(--line2);border-radius:16px;
  background:var(--field);padding:8px 8px 8px 14px;display:flex;gap:8px;align-items:flex-end}
.composer:focus-within{border-color:var(--line3)}
.composer textarea{flex:1;background:transparent;border:0;outline:none;color:var(--fg);
  font:14px/1.65 var(--sans);resize:none;max-height:150px;padding:4px 0}
.composer .send{width:34px;height:34px;border-radius:50%;border:0;background:var(--fg);
  color:var(--bg);font-size:15px;cursor:pointer;display:grid;place-items:center}
.composer .send:disabled{opacity:.35;cursor:default}
#statusline{max-width:760px;margin:7px auto 0;display:flex;gap:6px;align-items:center;
  font-size:11.5px;color:var(--faint);font-family:var(--mono)}
#statusline .spacer{flex:1}
#statusline .sep{color:var(--ghost)}
.spin{font-variant-numeric:tabular-nums}
.mpill{flex:none;font-size:11px;color:var(--faint);border:1px solid var(--line2);
  border-radius:8px;padding:1px 7px;font-family:var(--mono);margin-bottom:4px;
  white-space:nowrap}

/* ── 设置 ─────────────────────────────────────────────────────────────── */
#settings{position:fixed;inset:0;background:var(--bg);z-index:8;display:none;
  flex-direction:column}
#settings.open{display:flex}
#settings .shead button{background:transparent;border:1px solid var(--line2);
  color:var(--dim);border-radius:8px;padding:5px 12px;font:12px var(--sans);cursor:pointer}
#settings .shead button:hover{color:var(--fg);border-color:var(--line3)}
#settings .shead{display:flex;align-items:center;gap:10px;padding:12px 20px;
  border-bottom:1px solid var(--line);font-size:13px}
#settings .sbody{flex:1;overflow-y:auto;padding:14px 0 48px}
#settings .sinner{max-width:780px;margin:0 auto;padding:0 22px}
.forg{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);
  align-items:flex-start}
.forg .lab{flex:0 0 132px;font-size:13px;color:var(--fg2);padding-top:2px}
.forg .ctl{flex:1;min-width:0}
.forg input[type=text],.forg input[type=number]{width:100%;max-width:240px;
  background:var(--field);border:1px solid var(--line2);color:var(--fg);
  border-radius:8px;padding:6px 9px;font:12.5px var(--mono);outline:none}
.forg input:focus{border-color:var(--line3)}
.forg .hint{color:var(--faint);font-size:11.5px;margin-top:3px;line-height:1.5}
.pblock{border:1px solid var(--line);border-radius:10px;margin:10px 0;
  background:var(--panel);overflow:hidden}
.pblock>summary{padding:9px 13px;cursor:pointer;font-size:13px;list-style:none;
  display:flex;align-items:center;gap:8px;color:var(--fg2)}
.pblock>summary::-webkit-details-marker{display:none}
.pblock>summary .meta{margin-left:auto;color:var(--faint);font-size:11px;
  font-family:var(--mono)}
.pblock .pbody{padding:0 13px 12px;border-top:1px solid var(--line)}
.pblock .desc{color:var(--dim);font-size:12px;margin:8px 0}
.pblock textarea{width:100%;min-height:220px;background:var(--bg);color:var(--fg2);
  border:1px solid var(--line2);border-radius:8px;padding:10px;resize:vertical;
  font:12px/1.65 var(--mono);outline:none}
.pblock .acts{display:flex;gap:8px;margin-top:8px;align-items:center}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--field);border:1px solid var(--line2);color:var(--fg);
  padding:8px 16px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;
  transition:all .18s;z-index:20}
#toast.on{opacity:1;transform:translateX(-50%)}
.eitem{position:relative}
.eitem .del{position:absolute;right:-2px;top:0;opacity:0;background:none;border:0;
  color:var(--ghost);font-size:11px;cursor:pointer;padding:2px 4px;line-height:1;
  transition:color .12s,opacity .12s}
.eitem:hover .del{opacity:1}
.eitem .del:hover{color:var(--bad)}
@media (hover:none){.eitem .del{opacity:.45}}
/* ── 抽屉 ─────────────────────────────────────────────────────────────── */
#drawer{position:fixed;top:0;right:0;bottom:0;width:430px;max-width:92vw;
  background:var(--panel);border-left:1px solid var(--line2);transform:translateX(101%);
  transition:transform .18s ease;z-index:5;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer .dhead{display:flex;align-items:center;gap:10px;padding:13px 16px;
  border-bottom:1px solid var(--line);font-size:13px}
#drawer .dbody{flex:1;overflow-y:auto;padding:14px 16px 28px;font-size:12.5px}
.sec{margin-bottom:16px}
.sec h3{font-size:11px;font-weight:600;color:var(--ghost);margin:0 0 7px;
  letter-spacing:.05em}
details.item{border:1px solid var(--line);border-radius:8px;background:var(--raise);
  margin:6px 0;padding:0 10px}
details.item>summary{cursor:pointer;padding:7px 0;font-size:11.5px;color:var(--dim);
  list-style:none;display:flex;gap:8px;align-items:baseline;font-family:var(--mono)}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary .tag{color:var(--fg2)}
details.item>summary .meta{margin-left:auto;color:var(--ghost)}
details.item .body{padding:0 0 9px;font-family:var(--mono);font-size:11.5px;
  white-space:pre-wrap;word-break:break-word;color:var(--dim);max-height:280px;overflow:auto}
.entry{display:flex;gap:8px;padding:3px 0;border-bottom:1px dashed var(--line);
  font-family:var(--mono);font-size:11.5px}
.entry:last-child{border-bottom:0}
.entry .r{flex:0 0 40px;color:var(--ghost)}
.entry .c{flex:1;white-space:pre-wrap;word-break:break-word;max-height:110px;
  overflow:auto;color:var(--dim)}
.r.user{color:var(--ok)} .r.assistant{color:var(--you)} .r.tool{color:var(--tool)}
.r.note{color:var(--warn)}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 12px}
.chips button{background:transparent;border:1px solid transparent;color:var(--faint);
  border-radius:8px;padding:3px 10px;font:12.5px var(--sans);cursor:pointer}
.chips button:hover{color:var(--fg2)}
.chips button.on{background:var(--field);border-color:var(--line2);color:var(--fg)}
.rst{background:none;border:0;color:var(--you);font:inherit;font-size:11.5px;
  cursor:pointer;padding:0}
.rst:hover{text-decoration:underline}
.hist{display:flex;gap:10px;font-size:11.5px;font-family:var(--mono);
  color:var(--faint);padding:4px 0;border-bottom:1px solid var(--line)}
.hist b{color:var(--fg2);font-weight:500}
.hist span:first-child{color:var(--ghost);flex:0 0 128px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;
  transition:opacity .18s;z-index:4}
#scrim.on{opacity:1;pointer-events:auto}

#login{position:fixed;inset:0;background:rgba(10,10,11,.95);display:none;
  align-items:center;justify-content:center;z-index:9}
#login .box{background:var(--panel);border:1px solid var(--line2);border-radius:16px;
  padding:22px;width:340px}
#login input{width:100%;margin:10px 0;background:var(--bg);border:1px solid var(--line2);
  color:var(--fg);border-radius:9px;padding:9px 12px;font:inherit}
#login button{width:100%;background:var(--fg);border:0;color:var(--bg);border-radius:9px;
  padding:9px;font:inherit;font-weight:600;cursor:pointer}
@media (max-width:860px){#side{display:none}}
</style>
</head>
<body>

<aside id="side">
  <div class="brand"><i></i><span id="s-name">palimpsest</span></div>
  <button class="new" id="new-ctx">上下文</button>

  <div class="lab">今天</div>
  <div class="stat"><span>token</span><b id="s-today">0</b></div>
  <div class="stat"><span>步数</span><b id="s-steps">0</b></div>
  <div class="lab">上下文</div>
  <div class="stat"><span>当前块</span><b id="s-block">0</b></div>
  <div class="meter" id="m-block"><i></i></div>
  <div class="stat"><span>整次请求</span><b id="s-ctx">0</b></div>
  <div class="meter" id="m-ctx"><i></i></div>
  <div class="foot" id="s-foot">—</div>
</aside>

<div id="main">
  <div id="top">
    <div class="tabs"><span class="on" id="tab-chat">对话</span><span id="tab-ctx">上下文</span><span id="tab-set">设置</span></div>
    <div class="right">
      <span class="pill"><span class="dot" id="h-dot"></span> <span id="h-status">—</span></span>
      <span class="pill" id="h-detail"></span>
      <span class="pill" id="h-model"></span>
    </div>
  </div>

  <div id="thread"><div class="wrap"><div class="empty" id="empty">还没有记录。</div></div></div>

  <div id="bottom">
    <div class="composer">
      <textarea id="say" rows="1" placeholder="说一句…（回车发送，Shift+回车换行）"></textarea>
      <span class="mpill" id="c-model">—</span>
      <button class="send" id="send">↑</button>
    </div>
    <div id="statusline">
      <span id="st-hint"></span><span class="spacer"></span>
      <span class="spin" id="st-steps"></span><span class="sep">·</span>
      <span class="spin" id="st-tokens"></span><span class="sep">·</span>
      <span class="spin" id="st-hit"></span>
    </div>
  </div>
</div>

<div id="scrim"></div>
<aside id="drawer">
  <div class="dhead"><b>上下文</b><span style="color:var(--ghost)" id="d-sub"></span>
    <span style="flex:1"></span><button class="band" id="close-ctx">收起</button></div>
  <div class="dbody" id="d-body"></div>
</aside>

<div id="settings">
  <div class="shead">
    <b>设置</b>
    <span style="color:var(--faint);font-size:11.5px">参数和提示词都是改完就生效；只有改过代码才需要重启</span>
    <span style="flex:1"></span>
    <button id="set-save">保存并生效</button>
    <button id="set-restart">重启进程</button>
    <button id="set-close">收起</button>
  </div>
  <div class="sbody"><div class="sinner" id="set-body"></div></div>
</div>
<div id="toast"></div>
<div id="login"><div class="box">
  <div style="font-weight:600">需要令牌</div>
  <div style="color:var(--dim);font-size:12px;margin-top:4px">在服务器的
    <code>data/loop/web-token</code></div>
  <input id="token" type="password" placeholder="粘贴令牌">
  <button id="into">进去</button>
</div></div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const S = {token: localStorage.getItem("palimpsest.token") || "",
  since: "0:0", step: 0, lastStep: -1, pinned: true,
  usage: new Map(), calls: new Map(), ctxAt: 0, cache: null};

const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");
function k(n) {
  n = Number(n || 0);
  if (n < 1000) return String(n);
  if (n < 1e6) return (n / 1000).toFixed(1) + "k";
  return (n / 1e6).toFixed(2) + "M";
}
const hhmmss = (ts) => String(ts || "").slice(11, 19);

async function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({"Authorization": "Bearer " + S.token}, opts.headers || {});
  const res = await fetch(path, opts);
  if (res.status === 401) { $("login").style.display = "flex"; throw new Error("401"); }
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}
const wrap = () => { const w = document.createElement("div"); w.className = "wrap"; return w; };

/* ── 时间线 ───────────────────────────────────────────────────────────── */
function divider(step, ts) {
  const u = S.usage.get(step);
  const bits = ["第 " + step + " 步", hhmmss(ts)];
  if (u) {
    bits.push("输入 " + k(u.prompt));
    if (u.prompt) bits.push("命中 " + Math.round(100 * u.cache_hit / u.prompt) + "%");
    if (u.completion) bits.push("输出 " + k(u.completion));
  }
  const d = document.createElement("div");
  d.className = "divider";
  d.textContent = bits.join(" · ");
  return d;
}

function delBtn(item) {
  const b = document.createElement("button");
  b.className = "del";
  b.textContent = "✕";
  b.title = "删掉这条（连它的工具结果一起，改完自动重启一次）";
  b.onclick = async (ev) => {
    ev.stopPropagation();
    ev.preventDefault();
    if (!confirm("删掉这条？会连它的工具结果一起删，然后重启进程（约 3 秒）。")) return;
    try {
      await api("/entries?block=" + item.block + "&seq=" + item.seq,
        {method: "DELETE"});
      const host = b.closest(".eitem");
      if (host) host.remove();
      toast("已删除，下一步就用新的记录");
    } catch (e) { alert("删不了：" + e.message); }
  };
  return b;
}

function addEntry(item) {
  const e = $("empty"); if (e) e.remove();
  const box = $("thread");
  let w = box.lastElementChild;
  if (!w || !w.classList.contains("wrap")) { w = wrap(); box.appendChild(w); }

  if (item.step && item.step !== S.lastStep) {
    S.lastStep = item.step;
    w.appendChild(divider(item.step, item.ts));
  }

  const host = document.createElement("div");
  host.className = "eitem";
  let paired = false;

  if (item.role === "user") {
    const row = document.createElement("div");
    row.className = "row user";
    row.innerHTML = '<div class="body">' + esc(item.text) + "</div>";
    host.appendChild(row);
  } else if (item.role === "note") {
    const d = document.createElement("div");
    d.className = "note";
    d.textContent = item.text;
    host.appendChild(d);
  } else if (item.role === "tool") {
    const call = S.calls.get(item.call_id || "");
    const body = document.createElement("div");
    body.className = "fbody";
    body.textContent = String(item.text || "");
    paired = !!call;
    if (call) {
      call.appendChild(body);
    } else {
      const d = document.createElement("details");
      d.className = "frow";
      d.innerHTML = '<summary><span class="ico">≡</span><span class="ttl">结果</span>' +
        "</summary>";
      d.appendChild(body);
      host.appendChild(d);
    }
  } else {
    if (item.meta && item.meta.think) {
      const d = document.createElement("details");
      d.className = "frow";
      const line = String(item.meta.think).split("\n")[0].trim();
      d.innerHTML = '<summary><span class="ico">◌</span><span class="ttl">思考</span>' +
        '<span class="sdot"></span><span class="sum">' + esc(line) + "</span></summary>";
      const body = document.createElement("div");
      body.className = "fbody";
      body.textContent = String(item.meta.think);
      d.appendChild(body);
      host.appendChild(d);
    }
    for (const c of item.calls || []) {
      const fn = c.function || {};
      const d = document.createElement("details");
      d.className = "frow";
      d.innerHTML = '<summary><span class="ico">›</span><span class="ttl">' +
        esc(fn.name) + '</span><span class="sdot"></span><span class="sum">' +
        esc(fn.arguments || "") + "</span></summary>";
      S.calls.set(c.id || "", d);
      host.appendChild(d);
    }
    if (item.text) {
      const row = document.createElement("div");
      row.className = "row assistant";
      row.innerHTML = '<div class="body">' + esc(item.text) + "</div>";
      host.appendChild(row);
    }
  }

  // 已经并进调用卡里的结果，删的时候跟着调用一起走，别单给一个按钮。
  if (!paired) host.appendChild(delBtn(item));
  w.appendChild(host);
  if (S.pinned) box.scrollTop = box.scrollHeight;
}


/* ── 抽屉 ─────────────────────────────────────────────────────────────── */
function item(title, tag, meta, text) {
  const d = document.createElement("details");
  d.className = "item";
  d.innerHTML = '<summary><span class="tag">' + esc(title) + "</span>" +
    (tag ? '<span class="meta">' + esc(tag) + "</span>" : "") +
    (meta ? '<span class="meta">' + esc(meta) + "</span>" : "") +
    '</summary><div class="body">' + esc(text) + "</div>";
  return d;
}

function renderContext(c) {
  S.cache = c;
  const box = $("d-body");
  box.innerHTML = "";
  $("d-sub").textContent = "整次请求 " + k(c.context_tokens);

  const s1 = document.createElement("div");
  s1.className = "sec";
  s1.innerHTML = "<h3>占用</h3>" +
    "<div class=\"stat\"><span>当前块</span><b>" + k(c.current.tokens) + " / " +
    k(c.limits.block_tokens) + "</b></div>" +
    "<div class=\"meter\"><i style=\"width:" +
    Math.min(100, 100 * c.current.tokens / (c.limits.block_tokens || 1)) + "%\"></i></div>" +
    "<div class=\"stat\"><span>整次请求</span><b>" + k(c.context_tokens) + " / " +
    k(c.limits.context_budget) + "</b></div>" +
    "<div class=\"meter\"><i style=\"width:" +
    Math.min(100, 100 * c.context_tokens / (c.limits.context_budget || 1)) + "%\"></i></div>";
  box.appendChild(s1);

  const s2 = document.createElement("div");
  s2.className = "sec";
  s2.innerHTML = "<h3>旧段</h3>";
  if (!c.bands.length) {
    const p = document.createElement("div");
    p.className = "stat"; p.textContent = "还没有压缩过的段。";
    s2.appendChild(p);
  }
  for (const b of c.bands) {
    s2.appendChild(item("第 " + b.level + " 段", (b.start_ts || "").slice(5, 16),
      b.chars + " 字 · " + k(b.tokens), b.text));
  }
  box.appendChild(s2);

  const block = (title, data, opened) => {
    const sec = document.createElement("div");
    sec.className = "sec";
    sec.innerHTML = "<h3>" + esc(title) + "</h3>";
    if (!data.count) {
      const p = document.createElement("div");
      p.className = "stat"; p.textContent = "空的。";
      sec.appendChild(p); return sec;
    }
    const d = document.createElement("details");
    d.className = "item"; d.open = !!opened;
    d.innerHTML = '<summary><span class="tag">' + data.count + " 条</span>" +
      '<span class="meta">' + k(data.tokens) + " token</span></summary>" +
      '<div class="body"></div>';
    const body = d.querySelector(".body");
    for (const e of data.entries) {
      const row = document.createElement("div");
      row.className = "entry";
      let text = e.text || "";
      if ((e.calls || []).length) {
        text += (text ? "\n" : "") + e.calls.map((c) => "→ " +
          ((c.function || {}).name || "") + " " +
          ((c.function || {}).arguments || "")).join("\n");
      }
      row.innerHTML = '<span class="r ' + esc(e.role) + '">' +
        esc(e.role.slice(0, 4)) + '</span><span class="c">' + esc(text) + "</span>";
      body.appendChild(row);
    }
    sec.appendChild(d);
    return sec;
  };
  box.appendChild(block("上一块（原文）", c.previous, false));
  box.appendChild(block("当前块（在写）", c.current, true));

  const s3 = document.createElement("div");
  s3.className = "sec";
  s3.innerHTML = "<h3>sink</h3>";
  s3.appendChild(item("系统提示", "", c.sink.chars + " 字", c.sink.text));
  box.appendChild(s3);
}

/* ── 轮询 ─────────────────────────────────────────────────────────────── */
function paint(st) {
  $("s-name").textContent = st.name || "palimpsest";
  const kinds = {thinking: "在想", waiting: "在等", parked: "挂着", retry: "重试", idle: "闲"};
  $("h-status").textContent = kinds[st.status.kind] || "—";
  $("h-detail").textContent = st.status.detail || "";
  $("h-model").textContent = st.model || "";
  $("h-dot").className = "dot " + (st.status.kind || "");

  $("s-today").textContent = k(st.today.total);
  $("s-steps").textContent = st.steps;
  $("s-block").textContent = k(st.current_tokens) + " / " + k(st.block_tokens);
  $("s-ctx").textContent = k(st.context_tokens) + " / " + k(st.context_budget);
  $("m-block").firstElementChild.style.width =
    Math.min(100, 100 * st.current_tokens / (st.block_tokens || 1)) + "%";
  $("m-ctx").firstElementChild.style.width =
    Math.min(100, 100 * st.context_tokens / (st.context_budget || 1)) + "%";
  $("s-foot").textContent = "压缩 " + st.compressions + " 次";
  $("c-model").textContent = st.model || "—";
  $("st-steps").textContent = st.steps + " 步";
  $("st-tokens").textContent = k(st.today.total) + " tok";
  $("st-hit").textContent = "命中 " +
    Math.round(100 * (st.totals.hit_rate || 0)) + "%";
  $("st-hint").textContent = st.status.kind === "waiting"
    ? "在等：" + (st.status.detail || "有动静") : "";
}

async function poll() {
  try {
    const [feed, st] = await Promise.all([
      api("/feed?since=" + encodeURIComponent(S.since) + "&step=" + S.step),
      api("/state"),
    ]);
    for (const u of feed.steps) S.usage.set(u.step, u);
    if (feed.steps.length) S.step = feed.steps[feed.steps.length - 1].step;
    for (const e of feed.entries) addEntry(e);
    if (feed.entries.length) S.since = feed.cursor.block + ":" + feed.cursor.seq;
    paint(st);
    if ($("drawer").classList.contains("open") && Date.now() - S.ctxAt > 2500) {
      S.ctxAt = Date.now();
      renderContext(await api("/context"));
    }
  } catch (e) { }
}

/* ── 发送 ─────────────────────────────────────────────────────────────── */
async function send() {
  const ta = $("say");
  const text = ta.value.trim();
  if (!text) return;
  ta.value = ""; ta.style.height = "auto";
  $("send").disabled = true;
  try {
    await api("/say", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text})});
    S.pinned = true;
    poll();
  } catch (e) { ta.value = text; }
  $("send").disabled = false;
  ta.focus();
}

$("send").onclick = send;
$("say").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("say").addEventListener("input", (e) => {
  e.target.style.height = "auto";
  e.target.style.height = Math.min(150, e.target.scrollHeight) + "px";
});
$("thread").addEventListener("scroll", () => {
  const box = $("thread");
  S.pinned = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
});
function toggleDrawer(on) {
  $("drawer").classList.toggle("open", on);
  $("scrim").classList.toggle("on", on);
}
$("new-ctx").onclick = async () => {
  toggleDrawer(true);
  try { renderContext(await api("/context")); } catch (e) {}
};
$("close-ctx").onclick = () => toggleDrawer(false);
$("tab-ctx").onclick = $("new-ctx").onclick;
$("scrim").onclick = () => toggleDrawer(false);
$("into").onclick = () => {
  S.token = $("token").value.trim();
  localStorage.setItem("palimpsest.token", S.token);
  $("login").style.display = "none";
  S.since = "0:0"; S.step = 0; S.lastStep = -1; S.calls.clear();
  $("thread").innerHTML = '<div class="wrap"><div class="empty">载入中…</div></div>';
  poll();
};
/* ── 设置 ─────────────────────────────────────────────────────────────── */
let SET_FIELDS = [];
let SET_DATA = null;
let SET_GROUP = "";
let TOAST_T = 0;
function toast(msg) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(TOAST_T);
  TOAST_T = setTimeout(() => el.classList.remove("on"), 2200);
}

function fmtVal(v) {
  return Array.isArray(v) ? v.join(", ") : String(v);
}

function fieldRow(f, value, def, pending) {
  const row = document.createElement("div");
  row.className = "forg";
  let ctl = "";
  if (f.type === "bool") {
    ctl = '<input type="checkbox" data-key="' + f.key + '"' + (value ? " checked" : "") + ">";
  } else if (f.type === "ints") {
    ctl = '<input type="text" data-key="' + f.key + '" value="' +
      esc((value || []).join(", ")) + '">';
  } else if (f.type === "text") {
    ctl = '<input type="text" data-key="' + f.key + '" value="' + esc(value) + '">';
  } else {
    ctl = '<input type="number" step="' + (f.type === "float" ? "0.1" : "1") +
      '" data-key="' + f.key + '" value="' + esc(value) + '">';
  }
  const changed = fmtVal(value) !== fmtVal(def);
  const pendingNote = pending ? " · 已保存，待重启" : "";
  row.innerHTML = '<div class="lab">' + esc(f.label) + '</div><div class="ctl">' +
    ctl + '<div class="hint">' + esc(f.help || "") +
    (changed
      ? ' · <button class="rst" data-reset="' + f.key + '" data-def="' +
        esc(fmtVal(def)) + '">恢复默认 ' + esc(fmtVal(def)) + "</button>"
      : " · 默认 " + esc(fmtVal(def))) + pendingNote +
    "</div></div>";
  return row;
}

function renderSettings(data) {
  SET_DATA = data;
  SET_FIELDS = data.fields;
  const box = $("set-body");
  box.innerHTML = "";

  const sec1 = document.createElement("div");
  sec1.className = "sec";
  sec1.innerHTML = "<h3>运行参数</h3>";
  const chips = document.createElement("div");
  chips.className = "chips";
  if (!SET_GROUP) SET_GROUP = data.groups[0];
  for (const g of data.groups) {
    const b = document.createElement("button");
    b.textContent = g;
    b.className = g === SET_GROUP ? "on" : "";
    b.onclick = () => { SET_GROUP = g; renderSettings(SET_DATA); };
    chips.appendChild(b);
  }
  sec1.appendChild(chips);
  for (const f of data.fields) {
    if ((f.group || data.groups[0]) !== SET_GROUP) continue;
    const cur = (data.stored && data.stored[f.key] !== undefined)
      ? data.stored[f.key] : data.values[f.key];
    const pending = (data.stored && data.stored[f.key] !== undefined) &&
      fmtVal(cur) !== fmtVal(data.values[f.key]);
    sec1.appendChild(fieldRow(f, cur, data.defaults[f.key], pending));
  }
  box.appendChild(sec1);

  const sec2 = document.createElement("div");
  sec2.className = "sec";
  sec2.innerHTML = "<h3>提示词</h3>";
  for (const p of data.prompts) {
    const det = document.createElement("details");
    det.className = "pblock";
    det.innerHTML = '<summary>' + esc(p.label) +
      '<span class="meta">' + (p.override ? "已覆盖" : "默认") + " · " +
      esc(p.file) + '</span></summary><div class="pbody">' +
      '<div class="desc">' + esc(p.desc) + '</div>' +
      '<textarea data-pkey="' + esc(p.key) + '">' + esc(p.text) + "</textarea>" +
      '<div class="acts"><button data-psave="' + esc(p.key) + '">保存这份</button>' +
      '<button data-preset="' + esc(p.key) + '">恢复默认</button></div></div>';
    sec2.appendChild(det);
  }
  box.appendChild(sec2);

  const sec3 = document.createElement("div");
  sec3.className = "sec";
  sec3.innerHTML = "<h3>改动记录</h3>";
  if (!data.history || !data.history.length) {
    const p = document.createElement("div");
    p.className = "hint";
    p.textContent = "还没有改过。";
    sec3.appendChild(p);
  }
  for (const h of (data.history || []).slice(0, 30)) {
    const row = document.createElement("div");
    row.className = "hist";
    row.innerHTML = "<span>" + esc(h.ts || "") + "</span><b>" +
      esc(h.label || h.key) + "</b><span>" + esc(fmtVal(h.from)) + " → " +
      esc(fmtVal(h.to)) + "</span>";
    sec3.appendChild(row);
  }
  box.appendChild(sec3);
}
async function openSettings() {
  toggleDrawer(false);
  $("settings").classList.add("open");
  try { renderSettings(await api("/settings")); }
  catch (e) { toast("读不到设置"); }
}

function collectValues() {
  const values = {};
  const kinds = {};
  for (const f of SET_FIELDS) kinds[f.key] = f.type;
  for (const el of $("set-body").querySelectorAll("[data-key]")) {
    const key = el.getAttribute("data-key");
    const type = kinds[key] || "text";
    if (type === "bool") values[key] = el.checked;
    else if (type === "ints") {
      values[key] = el.value.split(",")
        .map((s) => Number(s.trim())).filter((n) => !isNaN(n));
    } else if (type === "text") values[key] = el.value.trim();
    else values[key] = Number(el.value);
  }
  return values;
}

async function saveParams() {
  try {
    await api("/settings", {method: "PUT",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({values: collectValues()})});
    toast("已生效");
    renderSettings(await api("/settings"));
  } catch (e) { toast("保存失败：" + e.message); }
}

$("set-body").addEventListener("click", async (ev) => {
  const t = ev.target;
  if (t.tagName !== "BUTTON") return;
  const resetField = t.getAttribute("data-reset");
  if (resetField) {
    const el = $("set-body").querySelector('[data-key="' + resetField + '"]');
    if (el) {
      const def = t.getAttribute("data-def") || "";
      if (el.type === "checkbox") el.checked = def === "true";
      else el.value = def;
    }
    return;
  }
  const save = t.getAttribute("data-psave");
  const reset = t.getAttribute("data-preset");
  if (!save && !reset) return;
  const key = save || reset;
  const area = $("set-body").querySelector('[data-pkey="' + key + '"]');
  const text = reset ? "" : (area ? area.value : "");
  try {
    await api("/prompts", {method: "PUT",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({key, text})});
    toast(reset ? "已恢复默认" : "已保存，立刻生效");
    renderSettings(await api("/settings"));
  } catch (e) { toast("保存失败：" + e.message); }
});
$("set-close").onclick = () => $("settings").classList.remove("open");
$("set-save").onclick = () => saveParams();
$("set-restart").onclick = async () => {
  if (!confirm("重启进程？约 3 秒，记录不受影响。只有改过代码才需要它。")) return;
  try {
    await api("/restart", {method: "POST"});
    toast("正在重启…");
    setTimeout(() => location.reload(), 3000);
  } catch (e) { toast("重启失败：" + e.message); }
};
$("tab-set").onclick = openSettings;
if (!S.token) $("login").style.display = "flex";
poll();
setInterval(poll, 1000);
</script>
</body>
</html>
