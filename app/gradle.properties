# 构建机固定参数（这台机器只有这一份，所以直接写在这里）
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.home=D:/Android/jdk-17

# ★ 沙箱下 Gradle 的原生文件监听会失败（守护进程日志：Couldn't open current thread, error = 5）
#   关掉它；代价只是每次构建全量扫一遍，对这个小工程无所谓。
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
