# 构建机参数（★ 这个文件在仓库里 ⇒ **对所有机器生效**，所以⛔ 写任何绝对路径）
#
# ⚠️ 2026-10-17：删掉了原来的 `org.gradle.java.home=C:/Android/jdk-17`。
#    理由：它是**这台机器**的 JDK 位置，换电脑就构建失败。
#    JDK 由 `build.ps1` 的 `JAVA_HOME` 给出（Gradle 会自己用它）；
#    不走 `build.ps1` 的（例如 IDE 直接跑）用 IDE 自己的 JDK —— 那是对的。
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# ★ 沙箱下 Gradle 的原生文件监听会失败（守护进程日志：Couldn't open current thread, error = 5）
#   关掉它；代价只是每次构建全量扫一遍，对这个小工程无所谓。
org.gradle.vfs.watch=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
